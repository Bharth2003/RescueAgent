  <rect x="680" y="132" width="290" height="46" rx="6" fill="#171A20" stroke="#2A303A"></rect>
  <text x="696" y="153" fill="#E9EBEE" font-size="14" font-weight="bold">Shelter / community larder</text>
  <text x="696" y="169" fill="#9BA3AE" font-size="11.5">signs for the load, capacity updated</text>

