  <text x="76" y="169" fill="#9BA3AE" font-size="11.5">describes surplus food, confirms handover</text>
  <rect x="370" y="132" width="290" height="46" rx="6" fill="#171A20" stroke="#2A303A"></rect>
  <text x="386" y="153" fill="#E9EBEE" font-size="14" font-weight="bold">Volunteer driver</text>
